name: Browser acceptance (no deployment)
on:
  push:
    branches: [qa/photo-map-browser-20261120]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck:browser
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: synthetic-browser-acceptance
          path: |
            playwright-report/
            test-results/
          retention-days: 7
